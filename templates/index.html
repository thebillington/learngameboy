{% extends "base.html" %}
{% block content %}
<article>
    <header>
        <h1 class="post-title">{{ page.title }}</h1>
    </header>
    <section class="post-content">
        {{ page.html|safe }}
    </section>
    {% if page.children %}
    <nav>
        <ul>
            {% for child in page.children %}
            <li><a href="{{ root_path }}{{ child.slug }}/index.html" title="{{ child.title }}">{{ child.title }}</a></li>
            {% endfor %}
        </ul>
    </nav>
    {% endif %}
</article>
{% endblock %}
