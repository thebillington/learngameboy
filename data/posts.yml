  html: <p>On the first of February 2020 we had the opportunity to visit the Retro
    Game Fair at the Marriott Hotel in Leeds. The fair was hosted by <a href="https://retroevents.co.uk/events">Retro
    Events</a>, a company that runs retro games fairs and competitions around the
    UK. We had a fantastic time at the event having had the opportunity to speak to
    retro game enthusiasts about all things retro, particularly the Game Boy and how
    to write code for it. At the event we were also trading in original Game Boys,
    selling refurbished consoles with custom glass screen protectors.</p>n<img src="/images/blog/leeds-retro-games-fair/stall.png">n<p>Our
    next event will be visiting the <a href="https://retrogamesfair.com/event/31">Nottingham
    Retro Games Fair</a> on Saturday the 25th April at the Britannia Hotel in Nottingham.
    Entry is £2 for adults and 50p for under 16s whilst under 6s go free. Make sure
    you come visit for what is sure to be a great event!</p>
