- html: '<p>Understanding how graphics work on the Game Boy is not easy, despite the
    process of actually generating data being relatively simple through the use of
    tools such as <a href="https://spkelly.net/tilegen/">Sean Kellys Tile Generator</a>
    and <a href="https://github.com/chrisantonellis/gbtdg">Chris Antonellis Tile Data
    Generator</a>. But before we use tools to help speed up the process of creating
    graphics it is important to understand the mathematics behind how the colour of
    each pixel on the screen is actually calculated.</p>n<blockquote>n<p>When working
    on low-level programming we should never rely on tools to completely abstract
    away the complexity of building something, only using them if we actually understand
    what is going on under the surface. Once you are able to get results without,
    only then should you start using the tool to increase productivity.</p>n</blockquote>n<h2>Tiles</h2>n<p>When
    getting graphics to display on the Game Boy screen we have to break down a larger
    image into a series of 8x8 pixel grids known as tiles. The Game Boy screen is
    160 pixels across by 144 pixels down which gives us a grid of tiles 20 across
    by 18 down:</p>n<img src="/images/screen/screen_tiles.png">n<p>If we zoom in on
    a single tile we can see that it is made of of 8x8 pixels:</p>n<img src="/images/screen/pixel_breakdown.png">n<p>We
    are also heavily limited on our use of colours:</p>n<ul>n<li>00 - White (very
    light green)</li>n<li>10 - Light Grey (light green)</li>n<li>01 - Dark Grey (dark
    green)</li>n<li>11 - Black (very dark green)</li>n</ul>n<p>Each pixel on the Game
    Boy screen requires two bits  allowing us four colours in total. This means that
    for a single row of pixel data within an 8x8 tile we require 16 bits (2 bytes)
    of data (2 bits per pixel, 8 pixels per row = 2x8 = 16 bits). Therefore an entire
    tile with 8 rows will require 128 bits (8 bytes) of data (16 bits per row, 8 rows
    per tile = 16 x 8 = 128).</p>n<p>Now, let''s have a look at the sort of images
    we can create with an 8x8 tile with only 4 colours:</p>n<img src="/images/screen/pixel_character.png">n<p>As
    you can see from this picture of a man it can be very difficult to create detailed
    images using only 4 colours and such a pixelated display. However we can easily
    solve this issue by putting several tiles together. In fact, this is exactly what
    Super Mario does to create the infamous Mario character sprite:</p>n<img src="/images/screen/pixel_mario.png">n<p>In
    order to display these images on the Game Boy we need a way to encode the data
    numerically. We do so by calculating the required colour value for each pixel
    and then encoding this using either binary or hexadecimal.</p>n<p>Lets start by
    numbering each of our pixels with the correct colour code:</p>n<img src="/images/screen/sprite_numbered.png">n<p>Next
    we need to convert our image data into a format that can be read by the Game Boy
    screen. As you can see each row of the image contains 16 bits (2 bytes) so to
    create our data representation we take the first bit of each pixel and put them
    together to create the first byte and the second byte of each pixel to create
    the second byte:</p>n<pre><code>00000000n00111100</code></pre>n<p>When we put
    these two bytes one above the other you can see that it corresponds to each of
    the pixels in the top row of our image:</p>n<img src="/images/screen/sprite_numbered_row.png">n<p>First
    pixel (00 = White):</p>n<table>n<thead>n<tr>n<th style="text-align: center;"></th>n<th
    style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th style="text-align:
    center;"></th>n<th style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th
    style="text-align: center;"></th>n<th style="text-align: center;"></th>n</tr>n</thead>n<tbody>n<tr>n<td
    style="text-align: center;"><strong><em>0</em></strong></td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n</tr>n<tr>n<td style="text-align: center;"><strong><em>0</em></strong></td>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">1</td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">1</td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">0</td>n<td
    style="text-align: center;">0</td>n</tr>n</tbody>n</table>n<p>Second pixel (00
    = White):</p>n<table>n<thead>n<tr>n<th style="text-align: center;"></th>n<th style="text-align:
    center;"></th>n<th style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th
    style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th style="text-align:
    center;"></th>n<th style="text-align: center;"></th>n</tr>n</thead>n<tbody>n<tr>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;"><strong><em>0</em></strong></td>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">0</td>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">0</td>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">0</td>n</tr>n<tr>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;"><strong><em>0</em></strong></td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">1</td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">1</td>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">0</td>n</tr>n</tbody>n</table>n<p>Third
    pixel (01 = Dark Green/Grey):</p>n<table>n<thead>n<tr>n<th style="text-align:
    center;"></th>n<th style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th
    style="text-align: center;"></th>n<th style="text-align: center;"></th>n<th style="text-align:
    center;"></th>n<th style="text-align: center;"></th>n<th style="text-align: center;"></th>n</tr>n</thead>n<tbody>n<tr>n<td
    style="text-align: center;">0</td>n<td style="text-align: center;">0</td>n<td
    style="text-align: center;"><strong><em>0</em></strong></td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n</tr>n<tr>n<td style="text-align: center;">0</td>n<td style="text-align:
    center;">0</td>n<td style="text-align: center;"><strong><em>1</em></strong></td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">1</td>n<td
    style="text-align: center;">1</td>n<td style="text-align: center;">0</td>n<td
    style="text-align: center;">0</td>n</tr>n</tbody>n</table>n<p>As you can see when
    we take the first value from the first byte and the first value from the second
    byte and combine them it gives us the colour value for each pixel in the row.
    If we repeat this for each individual row we have 16 bytes in total (2 bytes per
    row):</p>n<pre><code class="language-nasm">Man:nn    ; First rown    db %00000000n    db
    %00111100nn    ; Second rown    db %00111100n    db %00000000nn    ; Third rown    db
    %00111100n    db %00010100nn    ; Fourth rown    db %00111100n    db %00000000nn    ;
    Fifth rown    db %00000000n    db %00111100nn    ; Sixth rown    db %00100010n    db
    %00011100nn    ; Seventh rown    db %00000000n    db %00111100nn    ; Eighth rown    db
    %00010100n    db %00010100nnEndMan:</code></pre>n<blockquote>n<p>We specify a
    byte in gbZ80 ASM using the <strong>%</strong> sign with the <strong>db</strong>
    opcode.</p>n</blockquote>n<p>If you are still a little confused as to how the
    data we have relates to the image of our man then the secret to understanding
    is to start on the first row and read down then across. Doing so gives us:</p>n<pre><code
    class="language-nasm">; First rowndb %00000000ndb %00111100</code></pre>n<pre><code>00
    00 01 01 01 01 00 00</code></pre>n<img src="/images/screen/sprite_numbered_row.png">n<p>Repeating
    this for each row will give us the correct colour code for each individual pixel.</p>n<h2>Representing
    our image in Hex</h2>n<p>Although it is very easy to read image data stored as
    individual bytes the majority of the time you will actually see the image data
    represented in hex. You will remember from our lesson on <a href="http://learngameboy.com/getting-started/maths/hex-binary-conversion">binary
    hex conversion</a> that a hex number represents four bits. Therefore if we divide
    our number of bits for the full image (128 bits) by four then we get 32 hex digits
    to represent all of our image data.</p>n<p>Lets start by converting the first
    row of our image data into hex:</p>n<pre><code class="language-nasm">; First rowndb
    %00000000ndb %00111100</code></pre>n<pre><code>BINARY 0000 = 0 HEXnBINARY 0000
    = 0 HEXnBINARY 0011 = 3 HEXnBINARY 1100 = C HEX</code></pre>n<p>Therefore we know
    that to represent these 2 bytes we would use:</p>n<pre><code class="language-nasm">$00,
    $3C</code></pre>n<p>In gbZ80 Assembly the <strong>$</strong> sign signifies a
    byte in <strong>hex</strong> format. If we calculate the hex representation of
    each of our rows we get:</p>n<pre><code class="language-nasm">Man:nn    ; First
    rown    db %00000000 ; $00n    db %00111100 ; $3Cnn    ; Second rown    db %00111100
    ; $3Cn    db %00000000 ; $00nn    ; Third rown    db %00111100 ; $3Cn    db %00010100
    ; $14nn    ; Fourth rown    db %00111100 ; $3Cn    db %00000000 ; $00nn    ; Fifth
    rown    db %00000000 ; $00n    db %00111100 ; $3Cnn    ; Sixth rown    db %00100010
    ; $22n    db %00011100 ; $1Cnn    ; Seventh rown    db %00000000 ; $00n    db
    %00111100 ; $3Cnn    ; Eighth rown    db %00010100 ; $14n    db %00010100 ; $14nnEndMan:</code></pre>n<p>Now
    lets swap the binary format out and look at the full gbZ80 representation of our
    image in hex:</p>n<pre><code class="language-nasm">Man:n    db $00, $3C, $3C,
    $00, $3C, $14, $3C, $00n    db $00, $3C, $22, $1C, $00, $3C, $14, $14nEndMan:</code></pre>n<h2>Loading
    tile data into memory</h2>n<p>We are now going to look at some sample code to
    see how we go about loading a tile into memory ready to be used by the screen.
    Before we go any further lets take a quick look at the Game Boy memory map:</p>n<table>n<thead>n<tr>n<th
    style="text-align: left;">Start</th>n<th style="text-align: left;">End</th>n<th
    style="text-align: left;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align:
    left;">0000</td>n<td style="text-align: left;">3FFF</td>n<td style="text-align:
    left;">16KB ROM Bank 0</td>n</tr>n<tr>n<td style="text-align: left;">4000</td>n<td
    style="text-align: left;">7FFF</td>n<td style="text-align: left;">16KB Switchable
    ROM Bank</td>n</tr>n<tr>n<td style="text-align: left;">8000</td>n<td style="text-align:
    left;">9FFF</td>n<td style="text-align: left;">8KB Video RAM (VRAM)</td>n</tr>n<tr>n<td
    style="text-align: left;">A000</td>n<td style="text-align: left;">BFFF</td>n<td
    style="text-align: left;">8KB External RAM (Cartridge RAM)</td>n</tr>n<tr>n<td
    style="text-align: left;">C000</td>n<td style="text-align: left;">CFFF</td>n<td
    style="text-align: left;">4KB Work RAM (Main RAM)</td>n</tr>n<tr>n<td style="text-align:
    left;">D000</td>n<td style="text-align: left;">DFFF</td>n<td style="text-align:
    left;">4KB Work RAM (Switchable RAM in CGB mode)</td>n</tr>n<tr>n<td style="text-align:
    left;">E000</td>n<td style="text-align: left;">FDFF</td>n<td style="text-align:
    left;">8KB Mirror RAM (unused)</td>n</tr>n<tr>n<td style="text-align: left;">FE00</td>n<td
    style="text-align: left;">FE9F</td>n<td style="text-align: left;">Sprite Attribute
    Table (OAM)</td>n</tr>n<tr>n<td style="text-align: left;">FEA0</td>n<td style="text-align:
    left;">FEFF</td>n<td style="text-align: left;">Hardware Reserved (not usable)</td>n</tr>n<tr>n<td
    style="text-align: left;">FF00</td>n<td style="text-align: left;">FF7F</td>n<td
    style="text-align: left;">I/O Registers</td>n</tr>n<tr>n<td style="text-align:
    left;">FF80</td>n<td style="text-align: left;">FFFE</td>n<td style="text-align:
    left;">High RAM (HRAM)</td>n</tr>n<tr>n<td style="text-align: left;">FFFF</td>n<td
    style="text-align: left;">FFFF</td>n<td style="text-align: left;">Interrupts Enable
    Register (IE)</td>n</tr>n</tbody>n</table>n<p>As you can see the VRAM is held
    at memory address 8000-9FFF, however this is actually split up into several sections:</p>n<table>n<thead>n<tr>n<th
    style="text-align: left;">Start</th>n<th style="text-align: left;">End</th>n<th
    style="text-align: left;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align:
    left;">8000</td>n<td style="text-align: left;">97FF</td>n<td style="text-align:
    left;">Tile Data</td>n</tr>n<tr>n<td style="text-align: left;">9800</td>n<td style="text-align:
    left;">9BFF</td>n<td style="text-align: left;">Background Tile Map</td>n</tr>n<tr>n<td
    style="text-align: left;">9C00</td>n<td style="text-align: left;">9FFF</td>n<td
    style="text-align: left;">Window Tile Map</td>n</tr>n</tbody>n</table>n<blockquote>n<p>There
    is also the Sprite Attribute Table at address FE00-FE9F but you will learn more
    about this in the <a href="http://learngameboy.com/hardware/advanced-hardware/dma-and-oam">advanced
    hardware section</a>.</p>n</blockquote>n<p>The tile data section of memory holds
    all of the binary or hex information that describes the colour of each pixel in
    our tiles. This section is again split into 3 blocks:</p>n<table>n<thead>n<tr>n<th
    style="text-align: left;">Start</th>n<th style="text-align: left;">End</th>n<th
    style="text-align: left;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align:
    left;">8000</td>n<td style="text-align: left;">87FF</td>n<td style="text-align:
    left;">Block 0</td>n</tr>n<tr>n<td style="text-align: left;">8800</td>n<td style="text-align:
    left;">8FFF</td>n<td style="text-align: left;">Block 1</td>n</tr>n<tr>n<td style="text-align:
    left;">9000</td>n<td style="text-align: left;">97FF</td>n<td style="text-align:
    left;">Block 2</td>n</tr>n</tbody>n</table>n<p>For the purposes of this section
    we are going to take a look at how to load our image of a man:</p>n<pre><code
    class="language-nasm">Man:n    db $00, $3C, $3C, $00, $3C, $14, $3C, $00n    db
    $00, $3C, $22, $1C, $00, $3C, $14, $14nEndMan:</code></pre>n<p>In order to load
    our tile data we will need to fetch the values from the specific memory location
    in our ROM that the data is stored. Fortunately it is easy to check where the
    data starts and ends since we have specified our start and end addresses using
    the labels <strong>Man</strong> and <strong>EndMan</strong>.</p>n<blockquote>n<p>If
    you haven''t already, make sure you read about the <a href="http://learngameboy.com/hardware/hardware-overview/cpu">CPU</a>
    to get a basic understanding of gbZ80 ASM as in this section we will be looking
    at a more practical example. Take particular care to read the section on registers
    so that you fully understand how we are loading data in and out of the CPU.</p>n</blockquote>n<p>Remember
    that each location in Game Boy memory can hold 8-bits (one byte) of data and is
    addressed with a 16-bit value. Take a look at the data table which shows us the
    data held at some addresses in the ROM and VRAM:</p>n<table>n<thead>n<tr>n<th
    style="text-align: center;">ROM LOCATION</th>n<th style="text-align: center;">DATA</th>n<th
    style="text-align: center;"></th>n<th style="text-align: center;">VRAM LOCATION</th>n<th
    style="text-align: center;">DATA</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align:
    center;">2000</td>n<td style="text-align: center;">%00000000</td>n<td style="text-align:
    center;"></td>n<td style="text-align: center;">9000</td>n<td style="text-align:
    center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2001</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9001</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">2002</td>n<td style="text-align: center;">%00111100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9002</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2003</td>n<td
    style="text-align: center;">%00000000</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9003</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">2004</td>n<td style="text-align: center;">%00111100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9004</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2005</td>n<td
    style="text-align: center;">%00010100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9005</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">2006</td>n<td style="text-align: center;">%00111100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9006</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2007</td>n<td
    style="text-align: center;">%00000000</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9007</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">2008</td>n<td style="text-align: center;">%00000000</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9008</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2009</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9009</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">200A</td>n<td style="text-align: center;">%00100010</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900A</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">200B</td>n<td
    style="text-align: center;">%00011100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900B</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">200C</td>n<td style="text-align: center;">%00000000</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900C</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">200D</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900D</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">200E</td>n<td style="text-align: center;">%00010100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900E</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">200F</td>n<td
    style="text-align: center;">%00010100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900F</td>n<td style="text-align: center;">--------</td>n</tr>n</tbody>n</table>n<p>You
    can see that our image data is stored in our ROM from address 2000 to 200F and
    at this moment in time there is no data in the VRAM. In order to populate the
    VRAM with our tile data we will need an assembly program that is able to repeatedly
    copy data from one place to another.</p>n<p>Since we know each of our registers
    can only hold 8-bits in order to store a full address we are going to need to
    use the Game Boys ability to combine registers together to keep track of the addresses
    that we are loading into. We will store in our registers:</p>n<ul>n<li>HL - The
    location in the tile data block that we are loading the current byte of data into</li>n<li>DE
    - The location of the next byte of image data to load into the data block</li>n<li>BC
    - Keeps track of how many bytes we still have to load after this one</li>n</ul>n<p>Lets
    initialise our values:</p>n<pre><code class="language-nasm">ld hl, $9000nld de,
    Mannld bc, EndMan - Man</code></pre>n<p>You can see that we''ve loaded 9000 HEX
    ($) into HL which is the first location of tile data block 2. We have then loaded
    into DE the address of the first byte ($00) of our image. Lastly we have loaded
    BC with the number of bytes that we need to load. In our example above the tile
    data for our image sits at location $2000 of our ROM, therefore the label <strong>Man</strong>
    would resolve to $2000. Since there are 16 bytes in our image we know that the
    <strong>EndMan</strong> label must resolve to $2010. Therefore when we load BC
    with <em>EndMan - Man</em> we are actually loading BC with 16 ($2010 - $2000)
    but the assembler will take care of this for us. Remember that $2010 is in hex.</p>n<p>In
    order to actually load our data we will write a loop that can load a byte from
    the ROM into VRAM repeatedly for as long as the value in BC (the total number
    of bytes left to move) is bigger than zero:</p>n<pre><code class="language-nasm">.copyTilen    ld
    a, [de]n    ld [hl], an    inc hln    inc den    dec bcn    ld a, bn    or cn    jr
    nz, .copyImage</code></pre>n<blockquote>n<p>There is a lot going on in this code
    so if you''ve never worked with gbZ80 before don''t panic, we will go over everything
    in this snippet one step at a time.</p>n</blockquote>n<p>Sometimes it can be extremely
    complicated to understand what is going on in a given piece of code, particularly
    with Assembly, therefore let''s take a look at some pseudocode that breaks down
    the purpose of each line of code:</p>n<ul>n<li>Load the data at address <strong>DE</strong>
    into <strong>A</strong></li>n<li>Load data in <strong>A</strong> into the memory
    location pointed to by <strong>HL</strong></li>n<li>Increment <strong>HL</strong>
    (to point to the next location of VRAM)</li>n<li>Increment <strong>DE</strong>
    (to point to the next byte of data)</li>n<li>Decrement <strong>BC</strong></li>n<li>Load
    a with value held in <strong>B</strong></li>n<li>Or with <strong>C</strong></li>n<li>If
    <strong>B</strong> is not zero OR <strong>C</strong> is not zero, repeat</li>n</ul>n<p>Before
    we go any further lets look at the full code snippet together:</p>n<pre><code
    class="language-nasm">    ld hl, $9000n    ld de, Mann    ld bc, EndMan - Mann.copyTilen    ld
    a, [de]n    ld [hl], an    inc hln    inc den    dec bcn    ld a, bn    or cn    jr
    nz, .copyImage</code></pre>n<p>Lets load our registers with some values:</p>n<table>n<thead>n<tr>n<th
    style="text-align: center;">A</th>n<th style="text-align: center;">HL</th>n<th
    style="text-align: center;">DE</th>n<th style="text-align: center;">BC</th>n</tr>n</thead>n<tbody>n<tr>n<td
    style="text-align: center;">--------</td>n<td style="text-align: center;">$9000</td>n<td
    style="text-align: center;">$2000</td>n<td style="text-align: center;">$0010 (16)</td>n</tr>n</tbody>n</table>n<p>The
    first line of code we run after initialising our registers is:</p>n<pre><code>ld
    a, [de]</code></pre>n<p>You may think that this will load our value of <strong>DE</strong>
    into register <strong>A</strong> but notice that register <strong>DE</strong>
    is surrounded by square brackets. This is a signal to the CPU that instead of
    loading the value held in register <strong>DE</strong> into register <strong>A</strong>
    we load the value at the address pointed to by register <strong>DE</strong> instead.
    This is known as <strong>direct</strong> addressing.</p>n<p>Remember our table
    of values from before:</p>n<table>n<thead>n<tr>n<th style="text-align: center;">ROM
    LOCATION</th>n<th style="text-align: center;">DATA</th>n<th style="text-align:
    center;"></th>n<th style="text-align: center;">VRAM LOCATION</th>n<th style="text-align:
    center;">DATA</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align: center;">2000</td>n<td
    style="text-align: center;">%00000000</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9000</td>n<td style="text-align: center;">--------</td>n</tr>n<tr>n<td
    style="text-align: center;">2001</td>n<td style="text-align: center;">%00111100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9001</td>n<td
    style="text-align: center;">--------</td>n</tr>n<tr>n<td style="text-align: center;">2002</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
