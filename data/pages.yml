    dendec bc</code></pre>n<p>Increment means <strong>inc</strong>rease by one and
    decrement means <strong>dec</strong>rease by one. Lets check the new state of
    our registers:</p>n<table>n<thead>n<tr>n<th style="text-align: center;">A</th>n<th
