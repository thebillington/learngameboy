  title: Getting Started
- html: <p>We are Billy Rebecchi and Luke Wood, two video game, programming and retro
    tech enthusiasts with a wealth of experience and drive to learn more about computers
    and how they work. At the end of 2018 we started getting interested in the idea
    of developing games for the Game Boy, partly because we both love the system and
    have memories of playing Game Boy games as a child, but mainly because of the
    incredible challenges that learning to write code for the system would pose.</p>n<p>In
    early 2019 we took part in the global game jam and alongside a team of extremely
    talented artists, narrative designers and musicians created <a href="https://github.com/thebillington/Skazka/raw/master/main.gb">Skazka</a>
    in 48 hours. The game has no music, limited functionality and is incredibly buggy,
    but it is <strong>our</strong> Game Boy game and we couldn't be more proud.</p>n<p>Despite
    the successes of our first dive into Game Boy programming we found ourselves extremely
    discontented with the final product as it was very buggy and hard to keep working
    on, mainly due to the hacky nature of the initial code base. After several weeks
    of trying to push on working on the project we made the ultimate decision to scrap
    the game entirely and turn our attention instead to learning gbZ80 Assembly, a
    language that <a href="http://learngameboy.com/getting-started/why-assembly">we
    feel is much more suitable</a> for writing game code.</p>n<p>In his day job Billy
    is a Software Engineer working at Appoly, a mobile app and web development studio
    based in Leamington Spa, UK. He also runs his own <a href="https://www.instagram.com/retrorevival94/">retro
    refurb and repair service</a> as well as being heavily involved in <a href="https://www.theschoolrun.com/primary-school-computing-and-ict-glossary-for-parents">Computer
    Science Education</a>.</p>n<p>Luke is currently finishing his final year project
    of his Degree in Electrical Engineering, building a computer from basic components
    at the Digital Logic Level.</p>
