    center;">%00001111</td>n<td style="text-align: center;">$00 (%00000000)</td>n<td
    style="text-align: center;">$0F (%00001111)</td>n</tr>n</tbody>n</table>n<p>Remember
    that whenever we perform a logical or comparison operation we set our flags. In
    this case, after performing the OR operation our Z flag will be unset since the
    value in A is not zero. In fact, the only way to have our Z flag set after executing
    these two lines of code will be to have <strong>B</strong> and <strong>C</strong>
    both holding values of zero. So effectively our two lines of code check whether
    <strong>BC</strong> is holding a value of zero.</p>n<p>The next line of code is:</p>n<pre><code>jr
    nz, .copyImage</code></pre>n<p>Remember that the <strong>JR</strong> instruction
    jumps relative to the current location to another instruction. In this case  we
    jump backwards by 7 instructions to the <strong>.copyImage</strong> label only
    if the Z flag is <strong>not</strong> set. Since we know <strong>BC</strong> holds
    a value of 15, it isn''t zero so we will repeat our instructions with the values
