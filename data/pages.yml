    style="text-align: center;">2006</td>n<td style="text-align: center;">%00111100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9006</td>n<td
    style="text-align: center;">%00111100</td>n</tr>n<tr>n<td style="text-align: center;">2007</td>n<td
    style="text-align: center;">%00000000</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9007</td>n<td style="text-align: center;">%00000000</td>n</tr>n<tr>n<td
    style="text-align: center;">2008</td>n<td style="text-align: center;">%00000000</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">9008</td>n<td
    style="text-align: center;">%00000000</td>n</tr>n<tr>n<td style="text-align: center;">2009</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">9009</td>n<td style="text-align: center;">%00111100</td>n</tr>n<tr>n<td
    style="text-align: center;">200A</td>n<td style="text-align: center;">%00100010</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900A</td>n<td
    style="text-align: center;">%00100010</td>n</tr>n<tr>n<td style="text-align: center;">200B</td>n<td
    style="text-align: center;">%00011100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900B</td>n<td style="text-align: center;">%00011100</td>n</tr>n<tr>n<td
    style="text-align: center;">200C</td>n<td style="text-align: center;">%00000000</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900C</td>n<td
    style="text-align: center;">%00000000</td>n</tr>n<tr>n<td style="text-align: center;">200D</td>n<td
    style="text-align: center;">%00111100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900D</td>n<td style="text-align: center;">%00111100</td>n</tr>n<tr>n<td
    style="text-align: center;">200E</td>n<td style="text-align: center;">%00010100</td>n<td
    style="text-align: center;"></td>n<td style="text-align: center;">900E</td>n<td
    style="text-align: center;">%00010100</td>n</tr>n<tr>n<td style="text-align: center;">200F</td>n<td
    style="text-align: center;">%00010100</td>n<td style="text-align: center;"></td>n<td
    style="text-align: center;">900F</td>n<td style="text-align: center;">%00010100</td>n</tr>n</tbody>n</table>n<p>Before
    we have a look at the results of executing this program, lets have a quick look
    at the code in full:</p>n<pre><code class="language-nasm">Start:n    ; SETUP THE
    GAME BOYnn    ld hl, $9000n    ld de, Mann    ld bc, EndMan - Mannn.copyTilen    ld
    a, [de]n    ld [hl], an    inc hln    inc den    dec bcn    ld a, bn    or cn    jr
    nz, .copyImagenn    ; DO SOME MORE SETUPnnMan:n    db $00, $3C, $3C, $00, $3C,
    $14, $3C, $00n    db $00, $3C, $22, $1C, $00, $3C, $14, $14nEndMan:</code></pre>n<p>Be
    aware that if you try to assemble the given code using RGBDS then you will run
    into errors as there are a few more things you need to learn before we can actually
    get code running on the Game Boy, but lets have a look at what would happen if
    we were to create a Game Boy ROM with these as the only instructions:</p>n<img
    src="/images/screen/man_sprite_loaded.png">n<p>Not the output you were expecting?
    Those that are familiar with the Game Boy boot screen will see the familiar outline
    of the Nintendo logo, but why is our custom tile all over the Game Boy screen?
    Lets take a look at the VRAM viewer in BGB to get a better understanding of what
    is going on:</p>n<img src="/images/screen/vram_viewer_man.png">n<p>If you look
    on the right hand side of the window you can see that our custom tile (tile 00)
    is loaded into tile address <strong>0:9000</strong>. This makes sense as we know
    our code transferred the 16 bytes that make up our man into memory addresses $9000
    to $900F. So what is happening on the left hand side of the screen?</p>n<p>Well,
    remember that tile map memory is split up into three blocks:</p>n<table>n<thead>n<tr>n<th
    style="text-align: left;">Start</th>n<th style="text-align: left;">End</th>n<th
    style="text-align: left;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align:
    left;">8000</td>n<td style="text-align: left;">87FF</td>n<td style="text-align:
    left;">Block 0</td>n</tr>n<tr>n<td style="text-align: left;">8800</td>n<td style="text-align:
    left;">8FFF</td>n<td style="text-align: left;">Block 1</td>n</tr>n<tr>n<td style="text-align:
    left;">9000</td>n<td style="text-align: left;">97FF</td>n<td style="text-align:
    left;">Block 2</td>n</tr>n</tbody>n</table>n<p>We have loaded our tile data into
    block 2 (starting at address $9000), which means the bottom left grid of tiles
    corresponds to tile data bank 2. At the top left we can see the Nintendo Logo
    data is still held in bank 0 as we never cleared it. Lets check out one of these
    tiles to see where in memory it is stored:</p>n<img src="/images/screen/vram_nintendo_logo_n.png">n<p>As
    you can see the top left of the Nintendo logo is held in tile 01 of bank 0, which
    is address $8010-801F in memory. Lets now modify our code so that we can overwrite
    the top left of the Nintendo logo:</p>n<pre><code class="language-nasm">Start:n    ;
    SETUP THE GAME BOYnn    ld hl, $8010n    ld de, Mann    ld bc, EndMan - Mannn.copyTilen    ld
    a, [de]n    ld [hl], an    inc hln    inc den    dec bcn    ld a, bn    or cn    jr
    nz, .copyImagenn    ; DO SOME MORE SETUPnnMan:n    db $00, $3C, $3C, $00, $3C,
    $14, $3C, $00n    db $00, $3C, $22, $1C, $00, $3C, $14, $14nEndMan:</code></pre>n<p>Notice
    that all of this code is the same except for the initial value of <strong>HL</strong>.
    We have changed this to $8010 to reflect that we are overwriting tile 01 of bank
    0:</p>n<img src="/images/screen/overwrite_nintendo_logo.png">n<p>As you can see
    we are easily able to overwrite specific tiles anywhere in our tile banks if we
    know their location in memory. Next we will look at how to tell the Game Boy which
    tile bank we want to use, but first let us discuss why the VRAM viewer is showing
    6 banks of tiles instead of the 3 we originally looked at.</p>n<p>We know that
    the Game Boy has three blocks of tile data:</p>n<table>n<thead>n<tr>n<th style="text-align:
    center;">Start</th>n<th style="text-align: center;">End</th>n<th style="text-align:
    center;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td style="text-align: center;">8000</td>n<td
    style="text-align: center;">87FF</td>n<td style="text-align: center;">Block 0</td>n</tr>n<tr>n<td
    style="text-align: center;">8800</td>n<td style="text-align: center;">8FFF</td>n<td
    style="text-align: center;">Block 1</td>n</tr>n<tr>n<td style="text-align: center;">9000</td>n<td
    style="text-align: center;">97FF</td>n<td style="text-align: center;">Block 2</td>n</tr>n</tbody>n</table>n<p>However
    the Game Boy Color also has a second VRAM bank which we haven''t yet discussed.
    Therefore because BGB is GB Color compatible it shows us the extra bank even though
    we aren''t going to be using it.</p>n<blockquote>n<p>Since we are going to be
    programming games that are compatible on both the original GB and the Color we
    won''t be looking at how to switch to this extra bank, but remember the option
    is there if you eventually want to write games that are compatible with the Color
    exclusively.</p>n</blockquote>n<h2>LCDC Register (LCD Control)</h2>n<p>There is
    a special register known as the LCDC which tells the screen (Liquid Crystal Display)
    which mode it should currently be in. We won''t go into too much detail about
    this register now as we will look at all the options as and when we need them,
    but let us take a quick look at all the modes we can enable and disable using
    the LCDC.</p>n<p>Remember that a register is made up of a byte, or 8-bits. This
    means that with the LCDC register we can enable and disable 8 different modes
    on the Game Boy screen (the following is taken directly from the <a href="https://gbdev.gg8.se/wiki/articles/LCDC">gbdev
    wiki</a>):</p>n<ul>n<li>Bit 7 - LCD Display Enable</li>n<li>Bit 6 - Window Tile
    Map Display Select</li>n<li>Bit 5 - Window Display Enable</li>n<li>Bit 4 - BG
    &amp; Window Tile Data Select</li>n<li>Bit 3 - BG Tile Map Display Select</li>n<li>Bit
    2 - OBJ (Sprite) Size</li>n<li>Bit 1 - OBJ (Sprite) Display Enable</li>n<li>Bit
    0 - BG/Window Display/Priority</li>n</ul>n<p>There is a lot going on here so we
    will just go over the bits we actually need to look at for the purposes of getting
    data on the screen.</p>n<p>In our code example we inserted a placeholder comment
    to explain that we were doing some ''setting up'' of the Game Boy. Part of this
    setting up is telling the screen which mode it needs to be in before we change
    the tile data. To disable the screen fully we will write a value of 0 into the
    LCDC register:</p>n<pre><code class="language-nasm">ld a, %00000000nld [rLCDC],
    a</code></pre>n<blockquote>n<p>This isn''t strictly necessary but it is good practice
    when working with any old technology to disable the screen before changing data
    that should display on the screen.</p>n</blockquote>n<p>After we have written
    our data into VRAM we then need to re-enable the screen. To do this we will write
    enable into <strong>bit 7</strong> (LCD enable) and <strong>bit 0</strong> (background
    enable):</p>n<pre><code class="language-nasm">ld a, %10000001nld [rLCDC], a</code></pre>n<p>However
    this is enabling the LCD and setting the tile data select to use tile data block
    2. If we want to use block 0 we have to enable it on <strong>bit 4</strong>:</p>n<pre><code
    class="language-nasm">ld a, %10010001nld [rLCDC], a</code></pre>n<p>We have now
    set the screen to use block 0 and written our custom tile into location $8010
    (to overwrite the top left of the Nintendo logo):</p>n<img src="/images/screen/vram_bank_zero.png">n<p>This
    is what VRAM looks like:</p>n<img src="/images/screen/vram_viewer_bank_zero.png">n<p>And
    our final code:</p>n<pre><code class="language-nasm">Start:n    ; SETUP THE GAME
    BOYnn    ld a, %00000000n    ld [rLCDC], ann    ld hl, $8010n    ld de, Mann    ld
    bc, EndMan - Mannn.copyTilen    ld a, [de]n    ld [hl], an    inc hln    inc den    dec
    bcn    ld a, bn    or cn    jr nz, .copyImagenn    ld a, %10010001n    ld [rLCDC],
    ann    ; DO SOME MORE SETUPnnMan:n    db $00, $3C, $3C, $00, $3C, $14, $3C, $00n    db
    $00, $3C, $22, $1C, $00, $3C, $14, $14nEndMan:</code></pre>n<p>At this stage we
    know nearly everything we need to interact with the background layer and control
    the screen. Our next step will be to control which tile should display at which
    location.</p>n<h2>Tile Map</h2>n<p>Remember we looked earlier at our breakdown
    of VRAM:</p>n<table>n<thead>n<tr>n<th style="text-align: left;">Start</th>n<th
    style="text-align: left;">End</th>n<th style="text-align: left;">Use</th>n</tr>n</thead>n<tbody>n<tr>n<td
    style="text-align: left;">8000</td>n<td style="text-align: left;">97FF</td>n<td
    style="text-align: left;">Tile Data</td>n</tr>n<tr>n<td style="text-align: left;">9800</td>n<td
    style="text-align: left;">9BFF</td>n<td style="text-align: left;">Background Tile
    Map</td>n</tr>n<tr>n<td style="text-align: left;">9C00</td>n<td style="text-align:
    left;">9FFF</td>n<td style="text-align: left;">Window Tile Map</td>n</tr>n</tbody>n</table>n<p>We
    have already learned the purpose of the three tile data banks stored from $8000
    to $97FF, but what about the rest of VRAM? Well, remember that when we discussed
    the screen we mentioned that we have 20 horizontal tiles by 18 vertical tiles:</p>n<img
    src="/images/screen/screen_tiles.png">n<p>This is actually a little bit of a lie.
    It is true that at any given time there are 360 tiles visible on the screen, but
    actually our memory is capable of holding a total of 32x32 tiles (giving us a
    total of 1024 tiles). If we calculate the total number of memory addresses between
    location $9800 and $9C00 (9C00 - 9800) we get exactly 1024 tiles (400) therefore
    we know that the Background Tile Map can keep track of the correct tile to show
    for a specific tile on screen.</p>n<p>To help illustrate the point, look at this
    screenshot from the Super Mario Land game ROM:</p>n<img src="/images/screen/super_mario_in_game.png">n<p>Each
    tile on this screen must be loaded into memory:</p>n<img src="/images/screen/super_mario_tile_data.png">n<p>You
    can see that the question mark box has its corresponding tile data mapped into
    location $8810. Since we know there are 16 bytes of memory for each tile this
    makes it tile $81:</p>n<pre><code>$8810 - $8000 = $810n$810 / $10 = $81</code></pre>n<p>Or
    in decimal tile 129:</p>n<pre><code>34,832 - 32,768 = 2,064n2,064 / 16 = 129</code></pre>n<p>Each
    position on the screen must also map to a tile in memory:</p>n<img src="/images/screen/super_mario_tile_map.png">n<p>You
    will see that the map to the question mark box is stored at address $9976 of the
    tile map which makes it tile $177 (remember we include tile $9800 in our count).
    $177 in decimal is 374 and if you want to check then you will see the tile is
    on the 12th row at position 23:</p>n<pre><code>(11 * 32) + 22 = 352 + 23 =  377</code></pre>n<p>If
    we check the value held at position $9976 in our debugger you will see that it
    holds a value of $81 (look at the bottom left section of the debugger and you
    will see column 7 of row $9970 holds a value of $81):</p>n<img src="/images/screen/super_mario_debugger.png">n<p>This
    is all very well, but how does it actually correspond to us being able to put
    our man at a specific location?</p>n<p>Remember before we had our image of a man
    stored at location 0 of tile data bank 2:</p>n<img src="/images/screen/vram_viewer_man.png">n<p>Remember
    when we loaded our image data into position $2000 (VRAM bank 2)? We are about
    to use the same code again, but instead of referring to our image as <strong>Man</strong>
    we will refer to it as <strong>TileData</strong> and add an empty tile to the
    start:</p>n<pre><code class="language-nasm">Start:n    ; SETUP THE GAME BOYnn    ld
    a, %00000000n    ld [rLCDC], ann    ld hl, $9000n    ld de, TileDatan    ld bc,
    EndTileData - TileDatann.copyTilen    ld a, [de]n    ld [hl], an    inc hln    inc
    den    dec bcn    ld a, bn    or cn    jr nz, .copyImagenn    ld a, %10000001n    ld
    [rLCDC], ann    ; DO SOME MORE SETUPnnTileData:n    ; Blank tilen    db $00, $00,
    $00, $00, $00, $00, $00, $00n    db $00, $00, $00, $00, $00, $00, $00, $00nn    ;
    Mann    db $00, $3C, $3C, $00, $3C, $14, $3C, $00n    db $00, $3C, $22, $1C, $00,
    $3C, $14, $14nEndTileData:</code></pre>n<p>When we run this code the VRAM viewer
    looks like this (notice that we are no longer enabling position 4 of the LCDC
    register):</p>n<img src="/images/screen/tile_data_man_second.png">n<p>You can
    see that the man currently appears on the screen at the top left of where the
    Nintendo logo would have been:</p>n<img src="/images/screen/man_second_in_vram.png">n<p>Although
    we now have the man shown on screen on his own which is a desirable outcome, this
    is unintentional and only because of our tile happening to be over where the Nintendo
    logo was originally showing. So next we will write a quick loop to clear the screen.
    We will do this by iterating over every tile map location in our background tile
    map (from $9800 to $9BFF):</p>n<pre><code class="language-nasm">    ld hl, $9800n    ld
    de, $5FFn.clearLoopn    ld a, 0n    ld [hl], an    inc hln    dec den    ld a,
    en    or dn    jr nz, .clearLoop</code></pre>n<p>This code simply loads a value
    of 0 into every memory location from $9800 to $9BFF. It does so by repeatedly
    loading <strong>A</strong> with a value of zero and putting this into <strong>HL</strong>
    before incrementing <strong>HL</strong> and checking whether we have done this
    for every location $5FF times. After we have run this code the screen is cleared
    (meaning every tile location is using the tile we stored at location $9000, which
    is blank):</p>n<img src="/images/screen/cleared_screen.png">n<p>Now the last step
    is to decide where we want our man to be. Why not go for the bottom left corner?
    We will put him on the 1st tile in from the right and 1st tile up from the bottom.
    Remember that this will be the 17th row, so we have to count the 32 tiles on the
    preceding 16 rows to calculate the position we want the man to go:</p>n<pre><code>16
    * 32 = 512n512 + 1 = 513nDENARY 513 = 201 HEX</code></pre>n<p>Since we know the
    position of the top left tile is at memory address $9800, we must put a value
    of $01 into memory location $9A01 ($9800  + $201):</p>n<pre><code>ld hl, $9A01nld
    a, $01nld [hl], a</code></pre>n<p>Now for the code in full:</p>n<pre><code class="language-nasm">Start:n    ;
    SETUP THE GAME BOYnn    ld a, %00000000n    ld [rLCDC], ann    ld hl, $9000n    ld
    de, TileDatan    ld bc, EndTileData - TileDatann.copyTilen    ld a, [de]n    ld
    [hl], an    inc hln    inc den    dec bcn    ld a, bn    or cn    jr nz, .copyImagenn    ld
    hl, $9800n    ld de, $5FFn.clearLoopn    ld a, 0n    ld [hl], an    inc hln    dec
    den    ld a, en    or dn    jr nz, .clearLoopnn    ld hl, $9A01n    ld a, $01n    ld
    [hl], ann    ld a, %10000001n    ld [rLCDC], ann    ; DO SOME MORE SETUPnnTileData:n    ;
    Blank tilen    db $00, $00, $00, $00, $00, $00, $00, $00n    db $00, $00, $00,
    $00, $00, $00, $00, $00nn    ; Mann    db $00, $3C, $3C, $00, $3C, $14, $3C, $00n    db
    $00, $3C, $22, $1C, $00, $3C, $14, $14nEndTileData:</code></pre>n<p>And the final
    output:</p>n<img src="/images/screen/man_bottom_left.png">'
