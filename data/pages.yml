- html: <p>Welcome to <strong>Learn Game Boy</strong>, your one stop shop for learning
    to write games in gbZ80 Assembly for the original Game Boy system.</p>n<p>Learning
    to write Game Boy games is not an easy task, mainly due to the age of the system
    and the fact that programming has moved on to such an extent since 1989. Whilst
    learning to write software for the system we ran into many roadblocks which prevented
    us from making progress, but having pushed through the initial barriers our knowledge
    is now documented in this website to give any budding Game Boy programmers a good
    starting point for learning how the system works.</p>n<p>We understand that these
    tutorials may not suit everyones style of learning and there are a great many
    other resources available which we used ourselves. If you would prefer to go at
    it alone you can check out the <a href="https://gbdev.github.io/list.html">Awesome
    Game Boy List</a> for a ton of information you can use to undertake your own Game
    Boy programming journey.</p>n<p>Whether you are a seasoned programmer or newbie,
    we hope you are able to gain useful insights from the tutorials! It is now time
    to <a href="http://learngameboy.com/getting-started">get started</a> with your
    Game Boy programming journey!</p>
